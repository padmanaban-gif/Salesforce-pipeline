<template>
    <lightning-card title ='Indian team players'>
        <ul class ='slds-m-aound_medium'>
            <template iterator:it={Contacts} >

              <div if:true={it.first} class ='list-first'></div>

            </li>
        </template>
        </ul>
            
    </lightning-card>
</template>
