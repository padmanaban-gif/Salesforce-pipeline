<template>
    <lightning-card title = 'Simple Calculator' icon-name = 'standard:formula'>
        <lightning-layout multiple-rows>
            <lightning-layout-item size = '12' padding ='around-medium'>
                <lightning-input type="number" name = 'firstNumber' onchange = {numChangeHandler}></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size ='12' padding ='around-medium'>
                <lightning-input type ='number' name = 'secondNumber' onchange = {numChangeHandler}></lightning-input>
                
            </lightning-layout-item>
            <lightning-layout-item size ='12' padding = 'around-medium'>
                <lightning-button-group>
                    <lightning-button label ='add' icon-name ='utility:add' icon-position="right" onclick = {addHandler}></lightning-button>
                    <lightning-button label ='subtract' icon-name ='utility:dash' icon-position="right" onclick = {subHandler}></lightning-button>
                    <lightning-button label ='multiply' icon-name ='utility:close' icon-position="right" onclick = {mulHandler}></lightning-button>
                    <lightning-button label ='divide' icon-name ='utility:magicwand' icon-position="right" onclick = {divHandler}></lightning-button>
                </lightning-button-group>
            </lightning-layout-item>
            <lightning-layout-item size = '12' padding="around-medium">
                <lightning-formatted-text value = {finalValue}></lightning-formatted-text>
            </lightning-layout-item>
            <lightning-layout-item size ='12' padding ='around-medium'>
                <lightning-input type="checkbox" label = 'Show previous results' onchange={previosHandler}></lightning-input>
            </lightning-layout-item>
            <lightning-layout-item size ='12' padding = 'around-medium'>
                <template if:true = {showPreviousResult}>
                    <ul>
                        <template iterator:result ={previousResult}>
                            <li key ={result.value}>
                                <div if:true={result.first} class ='slds-border_top'></div>
                                <lightning-formatted-text value = {result.value}></lightning-formatted-text>
                                <div if:true={result.last} class ='slds-border_bottom'></div>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:false = {showPreviousResult}>
                    <p>please click the above checkbox to see the previous results</p>
                </template>
            </lightning-layout-item>
        </lightning-layout>
    </lightning-card>
</template>
