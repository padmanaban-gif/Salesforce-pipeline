<template>
    <lightning-card title ='Show Account' icon-name="standard:account">
        <lightning-input type="search" label="Search Accounts" value={searchterm}
        onchange={handleChange}></lightning-input>
        <ul>
            <template for:each={accounts} for:item="account">
                <li key={account.Id}>{account.Name}

                    <lightning-button variant="base" label="View Details"  title ='View Deatails' 
                    onclick ={hendleNav} data-id={account.Id}></lightning-button></li>
                
            </template>
        
            
        </ul>
    </lightning-card>
    
</template>
